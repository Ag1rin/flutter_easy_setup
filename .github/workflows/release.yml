name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: fes-windows-x64.exe
            alias: fes-windows.exe
            optional: false
          - os: windows-11-arm
            artifact: fes-windows-arm64.exe
            alias: ""
            optional: true
          - os: macos-latest
            artifact: fes-macos-arm64
            alias: fes-macos
            optional: false
          - os: macos-15-intel
            artifact: fes-macos-x64
            alias: ""
            optional: true
          - os: ubuntu-latest
            artifact: fes-linux-x64
            alias: fes-linux
            optional: false
          - os: ubuntu-24.04-arm
            artifact: fes-linux-arm64
            alias: ""
            optional: true
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Compile
        run: dart compile exe bin/flutter_easy_setup.dart -o ${{ matrix.artifact }}
      - name: Keep the README asset name
        if: matrix.alias != ''
        shell: bash
        run: cp "${{ matrix.artifact }}" "${{ matrix.alias }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.alias != ''
        with:
          name: ${{ matrix.alias }}
          path: ${{ matrix.alias }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          : > SHA256SUMS
          for file in $(find . -type f ! -name SHA256SUMS | sort); do
            hash=$(sha256sum "$file" | awk '{print $1}')
            name=$(basename "$file")
            printf '%s  %s\n' "$hash" "$name" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "Flutter Easy Setup $tag" \
            --repo "$GITHUB_REPOSITORY"
