name: flutter_easy_setup
description: >-
  Install and repair Flutter on Windows, macOS, and Linux with PATH,
  Android SDK, and doctor fixes.
version: 1.1.0
repository: https://github.com/Ag1rin/flutter_easy_setup
issue_tracker: https://github.com/Ag1rin/flutter_easy_setup/issues
topics:
  - cli
  - flutter
  - installer
  - android
  - developer-tools

environment:
  sdk: ^3.9.2

dependencies:
  args: ^2.7.0
  ansicolor: ^2.0.3
  crypto: ^3.0.6
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.0.0
  test: ^1.25.6

executables:
  fes: flutter_easy_setup
